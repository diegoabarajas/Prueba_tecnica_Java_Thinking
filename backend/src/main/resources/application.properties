spring.application.name=prueba-tecnica

# === PostgreSQL (Laragon) ===
# Ajusta estos valores según tu Laragon / DBeaver.
# Tu DB: prueba_tecnica_thinking
# Usuario: postgres
# Password: (vacío)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prueba_tecnica_thinking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate (en dev dejamos validate; Flyway es quien crea el esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
# Ignorar checksum de V5 que fue modificado después de aplicarse
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-future-migrations=false

# === Observability / Logging ===
# Incluye el correlationId (MDC) en cada línea de log. El CorrelationIdFilter lo setea por request.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} correlationId=%X{correlationId} - %msg%n
