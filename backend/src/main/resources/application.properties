spring.application.name=prueba-tecnica

# === PostgreSQL (Laragon) ===
# Ajusta estos valores según tu Laragon / DBeaver.
# Tu DB: prueba_tecnica_thinking
# Usuario: postgres
# Password: (vacío)
spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_tecnica_thinking
spring.datasource.username=postgres
spring.datasource.password=

# JPA / Hibernate (en dev dejamos validate; Flyway es quien crea el esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
