spring.application.name=prueba-tecnica

# === PostgreSQL (Laragon) ===
# Ajusta estos valores según tu Laragon. Si creas el usuario sugerido:
# - DB: prueba_tecnica
# - User: prueba_app
# - Pass: cambia_esto
spring.datasource.url=jdbc:postgresql://localhost:5432/prueba_tecnica
spring.datasource.username=prueba_app
spring.datasource.password=cambia_esto

# JPA / Hibernate (en dev dejamos validate; Flyway es quien crea el esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
