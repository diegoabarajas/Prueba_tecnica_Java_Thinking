# Perfil de tests: evita depender de PostgreSQL local.
spring.datasource.url=jdbc:h2:mem:prueba_tecnica;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# En tests no ejecutamos migraciones Postgres-specific; generamos esquema desde entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Logs más silenciosos en tests
logging.level.org.hibernate.SQL=warn

